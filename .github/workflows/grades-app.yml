name: Build Grades App

on:
  workflow_dispatch:
  push:
    tags:
      - "[0-9]*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: Grades
          - os: windows-latest
            asset: Grades.exe
          - os: macos-latest
            asset: Grades.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - name: 📂 setup
        uses: actions/checkout@v7

      - name: 🐍 setup python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: 📦 install dependencies
        run: pip install requests PySide6 pyinstaller

      - name: 🏷️ set windows version
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "Tag $TAG is not a numeric version like 1.1.0"; exit 1
          fi
          IFS=. read -r major minor patch build <<< "$TAG"
          numbers="${major}, ${minor:-0}, ${patch:-0}, ${build:-0}"
          dotted="${major}.${minor:-0}.${patch:-0}.${build:-0}"
          sed -i -E "s/(filevers|prodvers)=\([0-9, ]+\)/\1=(${numbers})/; s/'(FileVersion|ProductVersion)', '[0-9.]+'/'\1', '${dotted}'/" scripts/grades_version_info.txt
          grep -E "filevers|prodvers|FileVersion|ProductVersion" scripts/grades_version_info.txt

      - name: 🔨 build app
        run: pyinstaller --noconfirm scripts/course_glob_ui.spec

      - name: 🍏 package macos
        if: runner.os == 'macOS'
        run: |
          brew install create-dmg
          bash scripts/course_glob_ui_build.sh

      - name: 🚀 upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

      - name: 🏷️ attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/${{ matrix.asset }}
